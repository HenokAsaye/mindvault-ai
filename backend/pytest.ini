[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: fast isolated tests (default)
    integration: API and wiring tests with dependency overrides
    contract: adapter behavior against port contracts
